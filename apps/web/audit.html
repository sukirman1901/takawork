<!doctype html><html lang="id"><head><meta charset="UTF-8"><title>Prototype viewport checks</title><style>*{box-sizing:border-box}body{margin:0;font:12px system-ui;background:#e8ece3}header{padding:6px;display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;padding:5px 9px}iframe{border:0;display:block;transform-origin:top left}#stage{overflow:hidden}pre{padding:8px;white-space:pre-wrap;background:#fff}</style></head><body><header><button data-width="320">320</button><button data-width="768">768</button><button data-width="1024">1024</button><button data-width="1440">1440</button><button data-state="office">Kantor</button><button data-state="chat">Chat</button><button data-state="wizard">Buat worker</button></header><div id="stage"><iframe src="/" title="Prototype under test"></iframe></div><pre id="metrics">Memuat</pre><script>
const frame=document.querySelector('iframe'),stage=document.querySelector('#stage'),metrics=document.querySelector('#metrics');let width=1440,state='office';
function size(){const h=width===320?740:900,s=Math.min(1,innerWidth/width,(innerHeight-48)/h);frame.style.width=width+'px';frame.style.height=h+'px';frame.style.transform='scale('+s+')';stage.style.height=h*s+'px';}
function measure(){const d=frame.contentDocument,w=frame.contentWindow,scene=d.querySelector('.office-frame'),room=d.querySelector('.office-panel')?.getBoundingClientRect();metrics.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],state,overflow:d.documentElement.scrollWidth>w.innerWidth,title:d.title,chat:!!d.querySelector('.chat-panel'),dialog:!!d.querySelector('dialog[open]'),office:[room?.width,room?.height],scene:scene?.contentDocument?.body.dataset.scene,workers:scene?.contentDocument?.body.dataset.workers},null,2);}
function change(){size();const d=frame.contentDocument;d.querySelector('dialog[open]')?.dispatchEvent(new Event('cancel',{cancelable:true}));if(state==='office')d.querySelector('[aria-label="Kembali ke kantor"], [aria-label="Tutup chat"]')?.click();if(state==='chat'&&!d.querySelector('.chat-panel'))d.querySelector('.dock-avatar')?.click();if(state==='wizard')d.querySelector('.add-worker')?.click();requestAnimationFrame(()=>requestAnimationFrame(measure));}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;change()});document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;change()});frame.onload=()=>{size();setTimeout(measure,1200)};window.addEventListener('resize',size);size();
</script></body></html>
